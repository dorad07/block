<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 760'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#8e98a6'/><stop offset='1' stop-color='#4f5968'/>
    </linearGradient>
    <linearGradient id='blk' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#cfd5de'/><stop offset='1' stop-color='#9ea8b6'/>
    </linearGradient>
    <filter id='noise'>
      <feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/>
      <feColorMatrix type='saturate' values='0.2'/>
      <feComponentTransfer><feFuncA type='table' tableValues='0 0.08'/></feComponentTransfer>
    </filter>
  </defs>
  <rect width='1200' height='760' fill='url(#bg)'/>
  <rect y='600' width='1200' height='160' fill='#3f4752'/>
  <g transform='translate(170 210)'>
    <rect x='0' y='0' width='860' height='290' rx='22' fill='url(#blk)'/>
    <rect x='40' y='45' width='780' height='200' rx='14' fill='#8d97a4'/>
    <rect x='150' y='78' width='190' height='136' rx='18' fill='#626d7c'/>
    <rect x='520' y='78' width='190' height='136' rx='18' fill='#626d7c'/>
    <rect x='0' y='0' width='860' height='290' rx='22' fill='none' stroke='#d8dee7' stroke-opacity='.6'/>
  </g>
  <rect width='1200' height='760' filter='url(#noise)' opacity='.6'/>
  <rect x='0' y='0' width='1200' height='760' fill='none' stroke='#db2d2d' stroke-opacity='.45' stroke-width='14'/>
</svg>
